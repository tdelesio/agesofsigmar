version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://spearhead_user:spearhead_password@db:5432/spearhead_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: spearhead_user
      POSTGRES_PASSWORD: spearhead_password
      POSTGRES_DB: spearhead_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spearhead_user -d spearhead_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
